<title>INNOVATHON 2.0 en vivo</title>
<meta name="description" content="Pantalla del hack: cuenta regresiva, agenda, patrocinadores y Nova.">
<style>
@font-face { font-family:'Blackbird'; src:url({{BLACKBIRD}}) format('opentype'); font-display:block; }
@font-face { font-family:'JBM'; src:url({{JBM}}) format('woff2'); font-weight:100 800; font-display:block; }

:root {
  color-scheme: dark;
  --neon:#7CFF00; --ink:#050505; --grid:#0B1008; --white:#FFFFFF;
  --dim:#5f7a52; --line:#1c2b16; --code:#1b241b; --card:#0b100890;
  --k: min(calc(100vh / 900), calc(100vw / 1600));
  --mono:'JBM','JetBrains Mono',ui-monospace,Menlo,monospace;
  --display:'Blackbird','JBM',ui-monospace,monospace;
}
html, body { height:100%; }
body {
  margin:0; background:var(--ink); color:var(--white);
  font-family:var(--mono); overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
body.idle { cursor:none; }

/* rejilla del sitio + scanlines muy tenues */
.bg {
  position:fixed; inset:0; pointer-events:none;
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: calc(48 * var(--k)) calc(48 * var(--k));
}
.crt {
  position:fixed; inset:0; pointer-events:none; z-index:50;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px);
  mix-blend-mode:multiply;
}
.checker { position:fixed; top:0; right:0; width:calc(150 * var(--k)); height:calc(150 * var(--k)); pointer-events:none; }
.checker i { position:absolute; width:calc(16 * var(--k)); height:calc(16 * var(--k)); background:var(--neon); animation:blink 6s steps(1) infinite; }
@keyframes blink { 0%,100%{opacity:var(--o)} 50%{opacity:calc(var(--o) * .25)} }

.stage {
  position:relative; z-index:1; height:100%;
  display:grid; grid-template-rows:auto 1fr auto;
  padding-inline:calc(56 * var(--k)); box-sizing:border-box;
}

/* ─── header ─── */
header {
  display:flex; justify-content:space-between; align-items:baseline; gap:24px;
  padding-block:calc(36 * var(--k)) 0;
  font-size:calc(15 * var(--k)); letter-spacing:.14em; text-transform:uppercase;
}
.kicker b { color:var(--neon); }
.kicker span { color:var(--dim); }
.live { display:inline-block; width:.6em; height:.6em; background:var(--neon); margin-right:.6em; animation:pulse 1.4s steps(2) infinite; }
@keyframes pulse { 50% { opacity:.2; } }
.meta { display:flex; gap:calc(36 * var(--k)); color:var(--dim); margin-right:calc(150 * var(--k)); }
.meta b { color:var(--white); font-weight:700; }
#clock { font-variant-numeric:tabular-nums; }
.twelve { display:inline-flex; align-items:center; gap:.7em; }
.twelve b { font-variant-numeric:tabular-nums; }
.segs { display:inline-flex; gap:calc(3 * var(--k)); }
.segs i { width:calc(7 * var(--k)); height:calc(12 * var(--k)); background:var(--line); }
.segs i.on { background:var(--dim); }
.segs i.cur { background:var(--neon); animation:pulse 2s steps(2) infinite; }

/* ─── main ─── */
main {
  display:grid; grid-template-columns: 1.55fr 1fr; gap:calc(56 * var(--k));
  align-items:center; min-height:0;
}
.label { font-size:calc(18 * var(--k)); letter-spacing:.2em; color:var(--dim); text-transform:uppercase; }
.label b { color:var(--neon); margin-right:.5em; }
#count {
  font-family:var(--display); font-weight:400; color:var(--neon);
  font-size:calc(210 * var(--k)); line-height:.9; letter-spacing:-.01em;
  margin:calc(14 * var(--k)) 0 calc(22 * var(--k));
  font-variant-numeric:tabular-nums; white-space:nowrap;
}
#count.final { animation:pulse 1s steps(2) infinite; }
#count.word { font-size:calc(150 * var(--k)); }
.bar { height:calc(14 * var(--k)); background:var(--grid); border:1px solid var(--line); position:relative; }
.bar i { position:absolute; inset:0 auto 0 0; background:repeating-linear-gradient(90deg, var(--neon) 0 calc(10 * var(--k)), transparent calc(10 * var(--k)) calc(14 * var(--k))); }
.bar-cap { display:flex; justify-content:space-between; margin-top:calc(8 * var(--k)); font-size:calc(13 * var(--k)); color:var(--dim); letter-spacing:.1em; }

.now {
  margin-top:calc(40 * var(--k)); border:1px solid var(--line); background:var(--card);
}
.now-row {
  display:grid; grid-template-columns: calc(150 * var(--k)) calc(90 * var(--k)) 1fr; align-items:baseline;
  gap:calc(16 * var(--k)); padding:calc(18 * var(--k)) calc(24 * var(--k));
  font-size:calc(26 * var(--k));
}
.now-row + .now-row { border-top:1px solid var(--line); }
.now-row .tag { font-size:calc(14 * var(--k)); letter-spacing:.2em; color:var(--dim); }
.now-row.is-now .tag { color:var(--neon); }
.now-row .t { font-weight:700; font-variant-numeric:tabular-nums; }
.now-row .d { font-weight:500; }
.now-row.soft .t, .now-row.soft .d { color:var(--dim); }
.now-row .in { color:var(--dim); font-size:calc(16 * var(--k)); margin-left:.8em; }
code.cmd {
  font-family:var(--mono); font-size:.62em; background:var(--code); color:var(--neon);
  padding:.15em .55em; margin-left:.8em; vertical-align:.12em; white-space:nowrap;
}

/* ─── lado derecho: patrocinador + Nova ─── */
.side { display:grid; grid-template-rows:auto auto; gap:calc(28 * var(--k)); align-content:center; }
.spot {
  border:1px solid var(--line); background:var(--card);
  padding:calc(22 * var(--k)) calc(28 * var(--k)) calc(26 * var(--k));
}
.spot-head { display:flex; justify-content:space-between; font-size:calc(13 * var(--k)); letter-spacing:.2em; color:var(--dim); }
.spot-head b { color:var(--neon); }
.spot-logo {
  height:calc(170 * var(--k)); display:grid; place-items:center;
  transition:opacity .5s, transform .5s;
}
.spot-logo img { max-height:calc(96 * var(--k)); max-width:88%; filter:brightness(0) invert(1); }
.spot-logo.out { opacity:0; transform:translateY(8px); }
.spot-name { font-size:calc(16 * var(--k)); letter-spacing:.12em; text-transform:uppercase; color:var(--white); text-align:center; min-height:1.3em; }
.dots { display:flex; gap:6px; justify-content:center; margin-top:calc(14 * var(--k)); }
.dots i { width:calc(8 * var(--k)); height:calc(8 * var(--k)); background:var(--line); }
.dots i.on { background:var(--neon); }

.nova-row { display:flex; align-items:flex-end; gap:calc(18 * var(--k)); min-height:calc(300 * var(--k)); }
.bubble {
  flex:1; position:relative; align-self:center;
  border:1px solid var(--neon); padding:calc(18 * var(--k)) calc(22 * var(--k));
  font-size:calc(19 * var(--k)); line-height:1.45; min-height:4.4em;
  transition:opacity .4s;
}
.bubble::after {
  content:''; position:absolute; right:calc(-11 * var(--k)); bottom:calc(26 * var(--k));
  width:calc(18 * var(--k)); height:calc(18 * var(--k)); background:var(--ink);
  border-top:1px solid var(--neon); border-right:1px solid var(--neon); transform:rotate(45deg);
}
.bubble small { display:block; color:var(--dim); font-size:calc(12 * var(--k)); letter-spacing:.2em; margin-bottom:.5em; }
.bubble.out { opacity:0; }
#nova { transition:opacity .4s; }

/* sprites: tira horizontal de 8 frames */
.sprite {
  /* tamaños redondeados a pixel entero: con fracciones el navegador deja ver
     el borde del frame vecino en la tira */
  --h: round(calc(var(--fh) * var(--k) * 1.15), 1px);
  --w: round(calc(var(--h) * var(--fw) / var(--fh)), 1px);
  width:var(--w); height:var(--h); flex:none;
  background-repeat:no-repeat; background-size:calc(var(--w) * 8) var(--h);
  animation:play var(--dur, .9s) steps(8) infinite;
}
@keyframes play { from { background-position:0 0; } to { background-position:calc(var(--w) * -8) 0; } }
{{SPRITE_CSS}}

/* ─── ticker ─── */
footer {
  border-top:1px solid var(--line); margin-inline:calc(-56 * var(--k));
  padding-block:calc(22 * var(--k)); overflow:hidden; position:relative;
}
.track { display:flex; width:max-content; animation:scroll 70s linear infinite; }
.track span { display:flex; align-items:center; gap:calc(60 * var(--k)); padding-right:calc(60 * var(--k)); }
.track img { height:calc(38 * var(--k)); filter:brightness(0) invert(1); opacity:.85; }
.track em { color:var(--neon); font-style:normal; font-size:calc(10 * var(--k)); }
@keyframes scroll { to { transform:translateX(-50%); } }

/* ─── Nova de paso ─── */
.walker {
  position:fixed; z-index:20; left:0; bottom:calc(84 * var(--k));
  transform:translateX(-30vw); pointer-events:none;
  display:flex; align-items:flex-end; gap:calc(40 * var(--k));
}
.walker.go { animation:cross 16s linear forwards; }
@keyframes cross { from { transform:translateX(-20vw); } to { transform:translateX(110vw); } }

/* ─── celebración ─── */
.party {
  position:fixed; inset:0; z-index:30; display:grid; place-items:center; pointer-events:none;
  background:rgba(5,5,5,.86); opacity:0; transition:opacity .5s;
}
.party.on { opacity:1; }
.party-bots { display:flex; align-items:flex-end; gap:calc(30 * var(--k)); }
.party-in { display:flex; flex-direction:column; align-items:center; gap:calc(18 * var(--k)); text-align:center; }
.party h2 {
  margin:0; font-family:var(--display); font-weight:400; color:var(--neon);
  font-size:calc(120 * var(--k)); line-height:.95; text-transform:uppercase; text-wrap:balance; max-width:80vw;
}
.party p { margin:0; font-size:calc(22 * var(--k)); color:var(--white); letter-spacing:.06em; }

/* ─── escena con Nova y Avon ─── */
.scene {
  position:fixed; inset:0; z-index:25; background:#030303; opacity:0; pointer-events:none;
  transition:opacity .9s; display:grid; grid-template-columns:1fr 1fr; align-items:center;
}
.scene.on { opacity:1; }
.scene img {
  height:100vh; width:auto; max-width:50vw; object-fit:cover; justify-self:end;
  -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 60%, #000 55%, transparent 100%);
          mask-image: radial-gradient(ellipse 70% 70% at 50% 60%, #000 55%, transparent 100%);
}
.scene-text { padding-left:calc(96 * var(--k)); }
.scene-text .label { margin-bottom:calc(20 * var(--k)); }
.scene-text h2 {
  margin:0; font-family:var(--display); font-weight:400; font-size:calc(92 * var(--k));
  line-height:.95; text-transform:uppercase; text-wrap:balance;
}
.scene-text h2 em { font-style:normal; color:var(--neon); }
.scene-text p { color:var(--dim); font-size:calc(20 * var(--k)); margin:calc(24 * var(--k)) 0 0; letter-spacing:.06em; }
.scene-clock { position:absolute; top:calc(36 * var(--k)); left:calc(96 * var(--k)); font-size:calc(15 * var(--k)); letter-spacing:.14em; color:var(--dim); }
.scene-clock b { color:var(--neon); font-variant-numeric:tabular-nums; }

#sim { position:fixed; left:12px; bottom:8px; z-index:60; font-size:11px; color:var(--dim); }

/* teléfono: todo en una columna y con scroll */
@media (max-width: 820px) {
  :root { --k: calc(100vw / 820); }
  body { overflow:auto; }
  .stage { height:auto; min-height:100%; padding-inline:16px; }
  header { flex-direction:column; gap:8px; font-size:11px; }
  .meta { margin-right:0; flex-wrap:wrap; gap:12px; }
  main { grid-template-columns:1fr; padding-block:24px; gap:28px; }
  #count { font-size:clamp(56px, 18vw, 140px); }
  .now-row { grid-template-columns: 80px 56px 1fr; font-size:16px; padding:12px 14px; }
  .bubble { font-size:14px; }
  footer { margin-inline:-16px; }
  .scene { grid-template-columns:1fr; }
  .scene img { display:none; }
  .scene-text { padding-inline:16px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration:0s !important; animation-iteration-count:1 !important; transition:none !important; }
  .walker { display:none; }
}
</style>

<div class="bg"></div>
<div class="checker" id="checker"></div>

<div class="stage">
  <header>
    <div class="kicker"><i class="live"></i><b>40 PRINT</b> <span>"INNOVATHON 2.0" &middot; EN VIVO</span></div>
    <div class="meta">
      <span>WIFI <b id="wifi"></b></span>
      <span class="twelve" title="Tiempo restante del evento, 9:00 a 21:00">12 H <span class="segs" id="segs"></span><b id="twelve">12:00:00</b></span>
      <span><b id="clock">--:--</b></span>
    </div>
  </header>

  <main>
    <section>
      <div class="label"><b>&gt;</b><span id="count-label">ÚLTIMO COMMIT EN</span></div>
      <div id="count">--:--:--</div>
      <div class="bar"><i id="bar"></i></div>
      <div class="bar-cap"><span id="bar-a">09:30 ARRANCA</span><span id="bar-pct"></span><span id="bar-b">19:45 git commit -m "final"</span></div>

      <div class="now">
        <div class="now-row is-now" id="row-now"><span class="tag">AHORA</span><span class="t"></span><span class="d"></span></div>
        <div class="now-row" id="row-next"><span class="tag">SIGUIENTE</span><span class="t"></span><span class="d"></span></div>
      </div>
    </section>

    <aside class="side">
      <div class="spot">
        <div class="spot-head"><span><b>&gt;</b> CON EL APOYO DE</span><span id="spot-n"></span></div>
        <div class="spot-logo" id="spot-logo"><img alt="" id="spot-img"></div>
        <div class="spot-name" id="spot-name"></div>
        <div class="dots" id="dots"></div>
      </div>
      <div class="nova-row">
        <div class="bubble" id="bubble"><small id="who">NOVA DICE</small><span id="tip"></span></div>
        <div class="sprite s-idle" id="nova" role="img" aria-label="Nova, mascota de INNOVA"></div>
      </div>
    </aside>
  </main>

  <footer><div class="track" id="track"></div></footer>
</div>

<div class="walker" id="walker"></div>

<div class="party" id="party">
  <div class="party-in">
    <div class="party-bots">
      <div class="sprite s-jump" style="--dur:1.1s"></div>
      <div class="sprite a-jump" style="--dur:1.1s;animation-delay:-.3s"></div>
    </div>
    <h2 id="party-h"></h2>
    <p id="party-p"></p>
  </div>
</div>

<div class="scene" id="scene">
  <div class="scene-clock"><b id="scene-count"></b> <span id="scene-count-label"></span></div>
  <div class="scene-text">
    <div class="label"><b>&gt;</b>NOVA &amp; AVON</div>
    <h2 id="scene-h"></h2>
    <p id="scene-p"></p>
  </div>
  <img src="{{ROBOTS}}" alt="Nova y Avon, las mascotas de INNOVA, sentados con una laptop">
</div>

<div id="sim" hidden></div>
<div class="crt"></div>

<script>
/* ============ CONFIG · edita aquí ============ */
const WIFI = '[red] · [contraseña]';

const AGENDA = [
  ['08:30', 'Registro y acreditación', 1],
  ['09:00', 'Kickoff: reglas y equipos'],
  ['09:30', 'Arranca el hacking'],
  ['11:00', 'Coffee break · CAFFENIO', 1],
  ['11:30', 'Plática · AWS User Group Chihuahua'],
  ['12:00', 'Mentorías + 1er check-in'],
  ['16:00', 'Pizza party', 1],
  ['17:00', '2do check-in', 0, 'git status'],
  ['19:45', 'Último commit y entrega', 0, 'git commit -m "final"'],
  ['20:00', 'Ronda de pitches'],
  ['20:40', 'Deliberación'],
  ['20:50', 'Premiación y cierre'],
];

const TIPS = [
  'Hagan commit seguido. Nadie ha perdido un hackathon por hacer commit de más.',
  '¿Atorados? Los mentores andan rondando. Levanten la mano.',
  'La demo manda: que funcione antes de que se vea bonito.',
  'Tomen agua. El café de CAFFENIO no cuenta como agua.',
  'Su pitch dura 3 minutos. Ensáyenlo antes de las 19:45.',
  'Llenen su bloque en la presentación de pitches.',
  'Cinco minutos lejos de la pantalla. El bug va a seguir ahí.',
  'Un problema real le gana a una idea brillante.',
];

const SCENES = [
  ['Construyan <em>algo real</em>', 'Un problema de verdad, una demo que funcione y 3 minutos para contarlo.'],
  ['Hidrátense, <em>hackers</em>', 'El agua también compila.'],
  ['Pidan <em>ayuda</em>', 'Mentores y staff andan rondando. Para eso estamos.'],
  ['Commit, <em>push</em>, repeat', 'Lo que no está en el repo, no existe.'],
];

const SPONSORS = {{SPONSORS}};
/* ============================================= */

const $ = id => document.getElementById(id);
const toMin = hhmm => { const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; };
const pad = n => String(n).padStart(2, '0');
const EV_START = toMin('09:00') * 60, EV_END = toMin('21:00') * 60;
const HACK_START = toMin('09:30'), COMMIT = toMin('19:45'), PITCHES = toMin('20:00');

/* hora simulada para probar: flechas ← → mueven 15 min, 0 regresa a la hora real */
let offset = 0;
const now = () => new Date(Date.now() + offset * 60000);
const nowSec = () => { const d = now(); return d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds(); };

$('wifi').textContent = WIFI;
for (let i = 0; i < 12; i++) $('segs').appendChild(document.createElement('i'));

/* checker pixelado de la esquina, como en el PDF */
[[2,0,.19],[4,0,.45],[6,0,.41],[7,0,.39],[8,0,.54],[6,1,.52],[7,1,.16],[8,1,.48],[6,2,.54],[7,2,.34],[8,2,.12],[4,3,.37],[8,3,.48],[5,4,.5],[6,4,.52],[7,4,.29],[8,4,.13],[6,5,.35],[8,5,.28]]
  .forEach(([c, r, o], i) => {
    const el = document.createElement('i');
    el.style.cssText = `left:calc(${c} * 16.6 * var(--k));top:calc(${r} * 16.6 * var(--k));--o:${o};animation-delay:${-i * .7}s`;
    $('checker').appendChild(el);
  });

/* ticker: la lista va dos veces para que el loop no tenga costura */
const one = SPONSORS.map(s => `<img src="${s.src}" alt="${s.name}"><em>■</em>`).join('');
$('track').innerHTML = `<span>${one}</span><span aria-hidden="true">${one}</span>`;

/* spotlight de patrocinadores: todos reciben el mismo tiempo */
SPONSORS.forEach(() => $('dots').appendChild(document.createElement('i')));
let spotI = -1;
function nextSpot() {
  spotI = (spotI + 1) % SPONSORS.length;
  const s = SPONSORS[spotI];
  $('spot-logo').classList.add('out');
  setTimeout(() => {
    $('spot-img').src = s.src; $('spot-img').alt = s.name;
    $('spot-name').textContent = s.name;
    $('spot-n').textContent = `${pad(spotI + 1)}/${pad(SPONSORS.length)}`;
    [...$('dots').children].forEach((d, i) => d.classList.toggle('on', i === spotI));
    $('spot-logo').classList.remove('out');
  }, 450);
}

/* tips de Nova */
/* Nova y Avon se turnan el globo: cada tip lo dice uno distinto */
const BOTS = {
  nova: { name: 'NOVA', idle: 's-idle', moods: ['s-wave', 's-spin', 's-standup'] },
  avon: { name: 'AVON', idle: 'a-idle', moods: ['a-wave', 'a-spin'] },
};
let bot = BOTS.nova, tipI = -1, moodBusy = false;
function nextTip() {
  tipI = (tipI + 1) % TIPS.length;
  $('bubble').classList.add('out');
  $('nova').style.opacity = 0;
  setTimeout(() => {
    bot = tipI % 2 ? BOTS.avon : BOTS.nova;
    $('who').textContent = bot.name + ' DICE';
    $('nova').className = 'sprite ' + bot.idle;
    $('nova').setAttribute('aria-label', bot.name === 'NOVA' ? 'Nova, mascota de INNOVA' : 'Avon, mascota de INNOVA');
    $('nova').style.opacity = 1;
    $('tip').textContent = TIPS[tipI];
    $('bubble').classList.remove('out');
  }, 400);
}

/* el robot de la esquina casi siempre está quieto; a ratos hace algo */
let moodI = 0;
function novaMood() {
  const el = $('nova'), b = bot;
  el.className = 'sprite ' + b.moods[moodI++ % b.moods.length];
  el.style.setProperty('--dur', '1.2s');
  setTimeout(() => { if (bot === b) el.className = 'sprite ' + b.idle; el.style.removeProperty('--dur'); }, 3600);
}

function fmt(sec) {
  sec = Math.max(0, Math.floor(sec));
  return `${pad(Math.floor(sec / 3600))}:${pad(Math.floor(sec / 60) % 60)}:${pad(sec % 60)}`;
}

function setRow(row, a, extra) {
  const r = $(row);
  r.classList.toggle('soft', !!(a && a[2]));
  r.querySelector('.t').textContent = a ? a[0] : '';
  r.querySelector('.d').innerHTML = a
    ? a[1] + (a[3] ? `<code class="cmd">${a[3]}</code>` : '') + (extra ? `<span class="in">${extra}</span>` : '')
    : 'Gracias por construir con nosotros';
}

let lastMin = -1;
function tick() {
  const s = nowSec(), m = Math.floor(s / 60), d = now();
  $('clock').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`;

  let label, target = null, word = null;
  if (m < HACK_START) { label = 'ARRANCA EL HACKING EN'; target = HACK_START * 60; }
  else if (m < COMMIT) { label = 'ÚLTIMO COMMIT EN'; target = COMMIT * 60; }
  else if (m < PITCHES) { label = 'PITCHES EN'; target = PITCHES * 60; }
  else if (m < toMin('20:40')) { label = 'EN EL ESCENARIO'; word = 'PITCHES'; }
  else if (m < toMin('20:50')) { label = 'EL JURADO DELIBERA'; word = 'DELIBERACIÓN'; }
  else { label = 'SE ACABÓ'; word = 'PREMIACIÓN'; }

  /* las 12 horas del evento, un segmento por hora */
  const evLeft = Math.min(EV_END - EV_START, Math.max(0, EV_END - s));
  $('twelve').textContent = fmt(evLeft);
  const hr = Math.floor((s - EV_START) / 3600);
  [...$('segs').children].forEach((el, i) => {
    el.classList.toggle('on', s >= EV_START && i < hr);
    el.classList.toggle('cur', s >= EV_START && s < EV_END && i === hr);
  });

  $('count-label').textContent = label;
  const c = $('count');
  c.textContent = word || fmt(target - s);
  c.classList.toggle('word', !!word);
  c.classList.toggle('final', !word && target - s <= 600);
  $('scene-count').textContent = word || fmt(target - s);
  $('scene-count-label').textContent = label;

  const pct = Math.min(1, Math.max(0, (s - HACK_START * 60) / ((COMMIT - HACK_START) * 60)));
  $('bar').style.width = (pct * 100).toFixed(2) + '%';
  $('bar-pct').textContent = Math.round(pct * 100) + '% DEL HACK';

  let cur = -1;
  AGENDA.forEach((a, i) => { if (toMin(a[0]) <= m) cur = i; });
  const nxt = AGENDA[cur + 1];
  let inTxt = '';
  if (nxt) {
    const left = toMin(nxt[0]) - m;
    inTxt = left >= 60 ? `en ${Math.floor(left / 60)} h ${pad(left % 60)} min` : `en ${left} min`;
  }
  setRow('row-now', AGENDA[cur] || ['--:--', 'Aún no empezamos', 1]);
  setRow('row-next', nxt, inTxt);

  if (m !== lastMin) { if (lastMin !== -1) onMinute(m); lastMin = m; }
}

/* momentos que merecen celebración */
const HITOS = {
  [toMin('09:30')]: ['A hackear', '12 horas empiezan ahora.'],
  [toMin('11:00')]: ['Coffee break', 'Cortesía de CAFFENIO ☕'],
  [toMin('16:00')]: ['Pizza party', 'Suelten el teclado cinco minutos.'],
  [COMMIT - 60]: ['Queda 1 hora', 'Congelen features. Pulan la demo.'],
  [COMMIT - 30]: ['30 minutos', 'Suban lo que tengan. Ya.'],
  [COMMIT - 10]: ['10 minutos', 'git add . && git commit'],
  [COMMIT]: ['Teclas arriba', 'git commit -m "final"'],
  [PITCHES]: ['Pitches', 'Todos los que entregaron, al escenario.'],
};

let busy = false;
function party(h, p, ms = 9000) {
  if (busy) return; busy = true;
  $('party-h').textContent = h; $('party-p').textContent = p;
  $('party').classList.add('on');
  setTimeout(() => { $('party').classList.remove('on'); busy = false; }, ms);
}
let sceneI = 0;
function scene() {
  if (busy) return; busy = true;
  const [h, p] = SCENES[sceneI++ % SCENES.length];
  $('scene-h').innerHTML = h; $('scene-p').textContent = p;
  $('scene').classList.add('on');
  setTimeout(() => { $('scene').classList.remove('on'); busy = false; }, 12000);
}
const WALKS = ['s-walk', 'a-walk', 'both'];
let walkI = 0;
function walk() {
  const w = $('walker'), who = WALKS[walkI++ % WALKS.length];
  w.innerHTML = who === 'both'
    ? '<div class="sprite a-walk"></div><div class="sprite s-walk"></div>'
    : `<div class="sprite ${who}"></div>`;
  w.classList.remove('go'); void w.offsetWidth; w.classList.add('go');
}

function onMinute(m) {
  if (HITOS[m]) return party(...HITOS[m]);
  const inHack = m >= HACK_START && m < COMMIT;
  if (inHack && m % 60 === 0) {
    const left = Math.round((COMMIT - m) / 60 * 10) / 10;
    return party(`Una hora menos`, `Quedan ${String(left).replace('.', ',')} h para el último commit.`);
  }
  if (m % 12 === 6) return scene();
  if (m % 3 === 0) walk();
}

/* pantalla completa, pantalla encendida y cursor oculto */
document.addEventListener('click', async () => {
  try { if (!document.fullscreenElement) await document.documentElement.requestFullscreen(); } catch (e) {}
  try { await navigator.wakeLock?.request('screen'); } catch (e) {}
});
let idleT;
document.addEventListener('mousemove', () => {
  document.body.classList.remove('idle'); clearTimeout(idleT);
  idleT = setTimeout(() => document.body.classList.add('idle'), 2500);
});

/* controles de prueba */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') offset += 15;
  else if (e.key === 'ArrowLeft') offset -= 15;
  else if (e.key === '0') offset = 0;
  else if (e.key === 'p') return party('Una hora menos', 'Así se ve una celebración.');
  else if (e.key === 's') return scene();
  else if (e.key === 'w') return walk();
  else return;
  const sim = $('sim');
  sim.hidden = offset === 0;
  sim.textContent = `hora simulada: ${offset > 0 ? '+' : ''}${offset} min · 0 para volver`;
  lastMin = -1; tick();
});

nextSpot(); nextTip(); tick();
setInterval(tick, 250);
setInterval(nextSpot, 8000);
setInterval(nextTip, 20000);
setInterval(novaMood, 45000);
setTimeout(walk, 4000);
</script>
