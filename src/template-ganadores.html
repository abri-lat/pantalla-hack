<title>INNOVATHON 2.0 · Ganadores</title>
<meta name="description" content="Premiación del INNOVATHON 2.0: mejores integraciones y los tres primeros lugares.">
<style>
@font-face { font-family:'Blackbird'; src:url({{BLACKBIRD}}) format('opentype'); font-display:block; }
@font-face { font-family:'JBM'; src:url({{JBM}}) format('woff2'); font-weight:100 800; font-display:block; }

:root {
  color-scheme: dark;
  --neon:#7CFF00; --ink:#050505; --grid:#0B1008; --white:#FFFFFF;
  --dim:#5f7a52; --line:#1c2b16; --code:#1b241b; --card:#0b100890;
  --k: min(calc(100vh / 900), calc(100vw / 1600));
  --mono:'JBM','JetBrains Mono',ui-monospace,Menlo,monospace;
  --display:'Blackbird','JBM',ui-monospace,monospace;
}
html, body { height:100%; }
body {
  margin:0; background:var(--ink); color:var(--white);
  font-family:var(--mono); overflow:hidden; -webkit-font-smoothing:antialiased;
}
body.idle { cursor:none; }

/* ─── fondo compartido con la pantalla del evento ─── */
.bg {
  position:fixed; inset:0; pointer-events:none;
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: calc(48 * var(--k)) calc(48 * var(--k));
}
.crt {
  position:fixed; inset:0; pointer-events:none; z-index:50;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px);
  mix-blend-mode:multiply;
}
.checker { position:fixed; top:0; right:0; width:calc(150 * var(--k)); height:calc(150 * var(--k)); pointer-events:none; z-index:2; }
.checker i { position:absolute; width:calc(16 * var(--k)); height:calc(16 * var(--k)); background:var(--neon); animation:blink 6s steps(1) infinite; }
@keyframes blink { 0%,100%{opacity:var(--o)} 50%{opacity:calc(var(--o) * .25)} }
@keyframes pulse { 50% { opacity:.2; } }

/* ─── armazón del deck ─── */
.deck { position:relative; z-index:1; height:100%; display:grid; grid-template-rows:auto 1fr auto auto; box-sizing:border-box; }

header {
  display:flex; justify-content:space-between; align-items:baseline; gap:24px;
  padding:calc(36 * var(--k)) calc(56 * var(--k)) 0;
  font-size:calc(15 * var(--k)); letter-spacing:.14em; text-transform:uppercase;
}
.kicker b { color:var(--neon); }
.kicker span { color:var(--dim); }
.live { display:inline-block; width:.6em; height:.6em; background:var(--neon); margin-right:.6em; animation:pulse 1.4s steps(2) infinite; }
.meta { display:flex; gap:calc(36 * var(--k)); color:var(--dim); margin-right:calc(150 * var(--k)); }
.meta b { color:var(--white); font-weight:700; font-variant-numeric:tabular-nums; }

/* ─── slides ─── */
.slides { position:relative; min-height:0; }
.slide {
  position:absolute; inset:0; padding:calc(20 * var(--k)) calc(56 * var(--k));
  box-sizing:border-box; display:grid; align-content:center; justify-items:center;
  opacity:0; visibility:hidden; transform:translateY(calc(26 * var(--k)));
  transition:opacity .45s ease, transform .55s cubic-bezier(.2,.8,.2,1), visibility .45s;
}
.slide.on { opacity:1; visibility:visible; transform:none; }
.slide.out-back { transform:translateY(calc(-26 * var(--k))); }

.label { font-size:calc(18 * var(--k)); letter-spacing:.2em; color:var(--dim); text-transform:uppercase; text-align:center; }
.label b { color:var(--neon); margin-right:.5em; }

/* pasos que se revelan con la flecha */
.step { opacity:0; transform:translateY(calc(18 * var(--k))); transition:opacity .5s ease, transform .6s cubic-bezier(.2,.8,.2,1); }
.step.show { opacity:1; transform:none; }

/* ─── portada / cierre ─── */
.cover { display:grid; gap:calc(26 * var(--k)); justify-items:center; }
.cover h1 {
  margin:0; font-family:var(--display); font-weight:400; color:var(--neon);
  font-size:calc(150 * var(--k)); line-height:.9; text-transform:uppercase; text-align:center; text-wrap:balance;
}
.cover p { margin:0; font-size:calc(24 * var(--k)); color:var(--white); letter-spacing:.06em; text-align:center; }
.bots { display:flex; align-items:flex-end; gap:calc(34 * var(--k)); }

/* ─── slide de patrocinador (mejores integraciones) ─── */
.sponsor-slide { display:grid; gap:calc(22 * var(--k)); justify-items:center; align-content:center; width:100%; }
.sponsor-logo { height:calc(140 * var(--k)); display:grid; place-items:center; }
.sponsor-logo img { max-height:calc(140 * var(--k)); max-width:calc(620 * var(--k)); filter:brightness(0) invert(1); }
.sponsor-slide h2 {
  margin:0; font-family:var(--display); font-weight:400; font-size:calc(58 * var(--k));
  line-height:1; text-transform:uppercase; color:var(--white); text-align:center;
}
.sponsor-slide h2 em { font-style:normal; color:var(--neon); }
.winner {
  font-family:var(--display); font-weight:400; color:var(--neon);
  font-size:calc(140 * var(--k)); line-height:.9; text-transform:uppercase;
  text-align:center; text-wrap:balance; max-width:90vw; word-break:break-word;
}
.winner.long { font-size:calc(92 * var(--k)); }
.winner.empty { color:var(--line); font-size:calc(70 * var(--k)); }
.sponsor-prize {
  border-top:1px solid var(--line); padding-top:calc(16 * var(--k));
  max-width:calc(1100 * var(--k)); text-align:center;
}
.sponsor-prize b { color:var(--neon); font-size:calc(22 * var(--k)); letter-spacing:.06em; text-transform:uppercase; }
.sponsor-prize span { display:block; color:var(--dim); font-size:calc(17 * var(--k)); margin-top:calc(8 * var(--k)); line-height:1.5; }

/* ─── slide de lugar general ─── */
.place-slide { display:grid; gap:calc(18 * var(--k)); justify-items:center; width:100%; align-content:center; }
.place-kicker { font-size:calc(26 * var(--k)); letter-spacing:.28em; color:var(--dim); text-transform:uppercase; text-align:center; }
.place-kicker b { color:var(--neon); }
.place-team {
  font-family:var(--display); font-weight:400; color:var(--neon);
  font-size:calc(170 * var(--k)); line-height:.88; text-transform:uppercase;
  text-align:center; text-wrap:balance; max-width:90vw; word-break:break-word;
  margin:calc(6 * var(--k)) 0 calc(10 * var(--k));
}
.place-team.long { font-size:calc(110 * var(--k)); }
.place-team.empty { color:var(--line); font-size:calc(80 * var(--k)); }
.prizes { display:grid; grid-template-columns:repeat(var(--n), 1fr); gap:calc(18 * var(--k)); width:100%; max-width:calc(1440 * var(--k)); }
/* con seis premios cabe todo en una fila, pero hay que bajarle a los tamaños */
.prizes.tight { gap:calc(12 * var(--k)); }
.prizes.tight .prize { padding:calc(16 * var(--k)) calc(15 * var(--k)) calc(18 * var(--k)); grid-template-rows:calc(42 * var(--k)) auto auto; }
.prizes.tight .prize-logo img { max-height:calc(34 * var(--k)); max-width:calc(150 * var(--k)); }
.prizes.tight .prize-logo em { font-size:calc(34 * var(--k)); }
.prizes.tight .prize b { font-size:calc(17 * var(--k)); }
.prizes.tight .prize span { font-size:calc(13 * var(--k)); line-height:1.45; }
.prize {
  border:1px solid var(--line); background:var(--card);
  padding:calc(20 * var(--k)) calc(22 * var(--k)) calc(22 * var(--k));
  display:grid; grid-template-rows:calc(52 * var(--k)) auto auto; gap:calc(10 * var(--k)); align-content:start;
}
.prize-logo { display:flex; align-items:center; }
.prize-logo img { max-height:calc(42 * var(--k)); max-width:calc(190 * var(--k)); filter:brightness(0) invert(1); }
.prize-logo em { font-family:var(--display); font-style:normal; font-size:calc(42 * var(--k)); color:var(--white); line-height:1; }
.prize b { color:var(--neon); font-size:calc(21 * var(--k)); letter-spacing:.08em; text-transform:uppercase; line-height:1.2; }
.prize span { color:var(--dim); font-size:calc(15 * var(--k)); line-height:1.5; }

/* ─── ticker de patrocinadores ─── */
footer { border-top:1px solid var(--line); padding-block:calc(20 * var(--k)); overflow:hidden; }
.track { display:flex; width:max-content; animation:scroll 70s linear infinite; }
.track span { display:flex; align-items:center; gap:calc(60 * var(--k)); padding-right:calc(60 * var(--k)); }
.track img { height:calc(34 * var(--k)); filter:brightness(0) invert(1); opacity:.85; }
.track em { color:var(--neon); font-style:normal; font-size:calc(10 * var(--k)); }
@keyframes scroll { to { transform:translateX(-50%); } }

/* ─── sprites ─── */
.sprite {
  --h: round(calc(var(--fh) * var(--k) * 1.15), 1px);
  --w: round(calc(var(--h) * var(--fw) / var(--fh)), 1px);
  width:var(--w); height:var(--h); flex:none;
  background-repeat:no-repeat; background-size:calc(var(--w) * 8) var(--h);
  animation:play var(--dur, .9s) steps(8) infinite;
}
@keyframes play { from { background-position:0 0; } to { background-position:calc(var(--w) * -8) 0; } }
{{SPRITE_CSS}}

/* La pareja de robots acompaña los slides de premio. Va a media escala y
   anclada abajo a la derecha: así cabe en la franja que queda libre entre las
   tarjetas de premios y la barra de navegación, sin taparlas. */
.corner-bots {
  position:fixed; right:calc(30 * var(--k)); bottom:calc(122 * var(--k)); z-index:3;
  display:flex; align-items:flex-end; gap:calc(22 * var(--k)); pointer-events:none;
  transform:scale(.48); transform-origin:bottom right;
  opacity:0; transition:opacity .6s;
}
.corner-bots.on { opacity:1; }

/* confeti de pixeles: sin librerías, solo divs */
.confetti { position:fixed; inset:0; z-index:40; pointer-events:none; overflow:hidden; }
.confetti i {
  position:absolute; top:-6vh; width:calc(10 * var(--k)); height:calc(10 * var(--k));
  background:var(--neon); animation:fall var(--t) linear forwards;
}
@keyframes fall { to { transform:translateY(114vh) rotate(var(--r)); opacity:.15; } }

/* ─── barra de navegación del deck ─── */
.nav {
  display:flex; justify-content:space-between; align-items:center;
  padding:0 calc(56 * var(--k)) calc(14 * var(--k));
  font-size:calc(12 * var(--k)); letter-spacing:.2em; color:var(--dim); text-transform:uppercase;
}
.pips { display:flex; gap:calc(6 * var(--k)); }
.pips i { width:calc(26 * var(--k)); height:calc(5 * var(--k)); background:var(--line); transition:background .3s; cursor:pointer; }
.pips i.on { background:var(--neon); }
.pips i.seen { background:var(--dim); }
.hint b { color:var(--neon); }

@media (max-width: 820px) {
  :root { --k: calc(100vw / 820); }
  body { overflow:auto; }
  header, .nav { padding-inline:16px; }
  .meta { margin-right:0; }
  .slide { padding-inline:16px; }
  .prizes { grid-template-columns:1fr; }
  .corner-bots { display:none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration:0s !important; animation-iteration-count:1 !important; transition:none !important; }
  .confetti { display:none; }
}
</style>

<div class="bg"></div>
<div class="checker" id="checker"></div>

<div class="deck">
  <header>
    <div class="kicker"><i class="live"></i><b>40 PRINT</b> <span>"INNOVATHON 2.0" &middot; PREMIACIÓN</span></div>
    <div class="meta">
      <span id="deck-pos">01/08</span>
      <span><b id="clock">--:--</b></span>
    </div>
  </header>

  <div class="slides" id="slides"></div>

  <div class="nav">
    <div class="pips" id="pips"></div>
    <div class="hint"><b>&rarr;</b> SIGUIENTE &middot; <b>&larr;</b> ATRÁS &middot; <b>A</b> ADMIN</div>
  </div>

  <footer><div class="track" id="track"></div></footer>
</div>

<div class="corner-bots" id="corner-bots">
  <div class="sprite a-idle"></div>
  <div class="sprite s-idle"></div>
</div>
<div class="confetti" id="confetti"></div>
<div class="crt"></div>

<script>
/* ============ CONFIG · edita aquí ============ */

/* El deck completo, en el orden en que se presenta.
   `route` es la URL limpia que salta directo a ese slide (ver vercel.json). */
const DECK = [
  { id:'intro', route:'ganadores', kind:'cover',
    title:'ESTOS SON LOS GANADORES', sub:'INNOVATHON 2.0 · 12 horas · Parque Tecnológico Orión' },

  { id:'n8n', route:'n8n', kind:'sponsor', logo:'n8n',
    title:'MEJOR INTEGRACIÓN <em>N8N</em>',
    prize:'n8n Cloud Pro + swag oficial',
    prizeDesc:'Automatiza flujos de trabajo sin límites con la plataforma open-source líder en automatización.' },

  { id:'clerk', route:'clerk', kind:'sponsor', logo:'clerk',
    title:'MEJOR INTEGRACIÓN <em>CLERK</em>',
    prize:'Plan Pro de Clerk + swag especial',
    prizeDesc:'Autenticación y gestión de usuarios lista para producción, sin fricciones.' },

  { id:'elevenlabs', route:'elevenlabs', kind:'sponsor', logo:'elevenlabs',
    title:'MEJOR INTEGRACIÓN <em>ELEVENLABS</em>',
    prize:'3 meses de ElevenLabs Scale',
    prizeDesc:'1.8M créditos al mes por miembro para construir productos de voz con IA a escala.' },

  { id:'tercer', route:'tercer', kind:'place', kicker:'EL <b>TERCER</b> LUGAR ES PARA', prizes:[
    { logo:'livinglab',  b:'1 MES',        d:'Espacio de trabajo en Chihuahua Living Lab para darle vida a tu proyecto.' },
    { logo:'talentland', b:'BECAS',        d:'Una por integrante: entrada a Talent Land 2027, el festival de tecnología más grande de Latinoamérica.' },
    { logo:'elevenlabs', b:'3 MESES PRO',  d:'Voz con IA: clona voces, genera audio y crea experiencias sonoras.' },
    { logo:'clerk',      b:'SWAG BOX',     d:'Swag oficial de Clerk para todo el equipo.' },
  ]},

  { id:'segun', route:'segun', kind:'place', kicker:'EL <b>SEGUNDO</b> LUGAR ES PARA', prizes:[
    { logo:'livinglab',  b:'2 MESES',      d:'Espacio de trabajo en Chihuahua Living Lab para seguir desarrollando tu idea.' },
    { logo:'talentland', b:'BECAS',        d:'Una por integrante: entrada a Talent Land 2027, el festival de tecnología más grande de Latinoamérica.' },
    { logo:'elevenlabs', b:'3 MESES PRO',  d:'Voz con IA: clona voces, genera audio y crea experiencias sonoras.' },
    { logo:'clerk',      b:'SWAG BOX',     d:'Swag oficial de Clerk para todo el equipo.' },
    { logo:'n8n',        b:'SWAG BOX',     d:'Swag oficial de n8n para todo el equipo.' },
  ]},

  { id:'primer', route:'primer', kind:'place', kicker:'EL <b>PRIMER</b> LUGAR ES PARA', prizes:[
    { logo:'livinglab',  b:'3 MESES',      d:'Espacio de trabajo en Chihuahua Living Lab para seguir con tu proyecto después del hack.' },
    { logo:'talentland', b:'BECAS',        d:'Una por integrante: entrada a Talent Land 2027, el festival de tecnología más grande de Latinoamérica.' },
    { text:'$10K',       b:'VUELOS A TALENT LAND', d:'10,000 pesos para los vuelos del equipo a Guadalajara.' },
    { logo:'elevenlabs', b:'3 MESES PRO',  d:'Voz con IA: clona voces, genera audio y crea experiencias sonoras.' },
    { logo:'clerk',      b:'SWAG BOX',     d:'Swag oficial de Clerk para todo el equipo.' },
    { logo:'n8n',        b:'SWAG BOX',     d:'Swag oficial de n8n para todo el equipo.' },
  ]},

  { id:'gracias', route:'gracias', kind:'cover',
    title:'GRACIAS POR CONSTRUIR', sub:'Nos vemos en la siguiente · git push origin main' },
];

const SPONSORS = {{SPONSORS}};
const LOGOS = {{LOGOS}};
const CHANNEL = 'innovathon-ganadores';
const STORE = 'innovathon.ganadores.v1';
/* ============================================= */

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');

/* ── nombres de equipo: los escribe /admin y viven en localStorage ──
   Claves: primer, segun, tercer, n8n, clerk, elevenlabs */
let NAMES = {};
function loadNames() {
  try { NAMES = JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { NAMES = {}; }
}
loadNames();

/* ── construcción del deck ──
   En los patrocinadores el podio se revela de abajo hacia arriba: 3º, 2º y al final el 1º. */
function slideHTML(s) {
  if (s.kind === 'cover') {
    return `<div class="cover step" data-step="0">
      <div class="bots">
        <div class="sprite a-jump" style="--dur:1.1s"></div>
        <div class="sprite s-jump" style="--dur:1.1s;animation-delay:-.3s"></div>
      </div>
      <h1>${s.title}</h1>
      <p>${s.sub}</p>
    </div>`;
  }
  if (s.kind === 'sponsor') {
    return `<div class="sponsor-slide">
      <div class="step" data-step="0" style="display:grid;gap:calc(18 * var(--k));justify-items:center">
        <div class="sponsor-logo"><img alt="${s.id}" src="${LOGOS[s.logo] || ''}"></div>
        <h2>${s.title}</h2>
      </div>
      <div class="winner step empty" data-step="1" data-name="${s.id}"></div>
      <div class="sponsor-prize step" data-step="2"><b>${s.prize}</b><span>${s.prizeDesc}</span></div>
    </div>`;
  }
  /* kind === 'place' */
  const prizes = s.prizes.map(p => `
    <div class="prize">
      <div class="prize-logo">${p.logo ? `<img alt="" src="${LOGOS[p.logo] || ''}">` : `<em>${p.text}</em>`}</div>
      <b>${p.b}</b><span>${p.d}</span>
    </div>`).join('');
  const n = s.prizes.length;
  return `<div class="place-slide">
    <div class="place-kicker step" data-step="0">${s.kicker}</div>
    <div class="place-team step empty" data-step="1" data-name="${s.id}"></div>
    <div class="prizes step ${n >= 6 ? 'tight' : ''}" data-step="2" style="--n:${n}">${prizes}</div>
  </div>`;
}

DECK.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide';
  el.id = 'slide-' + s.id;
  el.innerHTML = slideHTML(s);
  $('slides').appendChild(el);
  const pip = document.createElement('i');
  pip.title = s.id;
  pip.addEventListener('click', ev => { ev.stopPropagation(); go(i, 0); });
  $('pips').appendChild(pip);
});

/* pasos por slide: el máximo data-step declarado, más uno */
const STEPS = DECK.map((s, i) => {
  const ds = [...$('slides').children[i].querySelectorAll('[data-step]')].map(e => +e.dataset.step);
  return Math.max(0, ...ds) + 1;
});

/* ── pintar los nombres ── */
function paint() {
  document.querySelectorAll('[data-name]').forEach(el => {
    const v = (NAMES[el.dataset.name] || '').trim();
    el.textContent = v || '· · ·';
    el.classList.toggle('empty', !v);
    el.classList.toggle('long', v.length > 14);
  });
}
paint();

/* ── navegación ── */
let cur = 0, step = 0, suppress = false;

function render(back) {
  [...$('slides').children].forEach((el, i) => {
    el.classList.toggle('on', i === cur);
    el.classList.toggle('out-back', !!back && i !== cur);
    el.querySelectorAll('.step').forEach(s => s.classList.toggle('show', i === cur && +s.dataset.step <= step));
  });
  [...$('pips').children].forEach((p, i) => {
    p.classList.toggle('on', i === cur);
    p.classList.toggle('seen', i < cur);
  });
  $('deck-pos').textContent = `${pad(cur + 1)}/${pad(DECK.length)}`;
  $('corner-bots').classList.toggle('on', DECK[cur].kind !== 'cover');
  history.replaceState(null, '', '#' + DECK[cur].id);
}

function go(slide, st, back) {
  cur = Math.max(0, Math.min(DECK.length - 1, slide));
  step = Math.max(0, Math.min(STEPS[cur] - 1, st));
  render(back);
  broadcast();
}

/* el momento de revelar: confeti cuando cae el nombre de un lugar general
   o la mejor integración de un patrocinador */
function isBigReveal() {
  const s = DECK[cur];
  return step === 1 && (s.kind === 'place' || s.kind === 'sponsor');
}

function next() {
  if (step < STEPS[cur] - 1) { step++; render(); if (isBigReveal()) confetti(); }
  else if (cur < DECK.length - 1) { cur++; step = 0; render(); }
  else return;
  broadcast();
}
function prev() {
  if (step > 0) step--;
  else if (cur > 0) { cur--; step = STEPS[cur] - 1; }
  else return;
  render(true);
  broadcast();
}

function confetti() {
  const box = $('confetti');
  for (let i = 0; i < 70; i++) {
    const c = document.createElement('i');
    c.style.left = (Math.random() * 100).toFixed(2) + 'vw';
    c.style.setProperty('--t', (2.4 + Math.random() * 2.2).toFixed(2) + 's');
    c.style.setProperty('--r', Math.round(Math.random() * 1080 - 540) + 'deg');
    c.style.animationDelay = (Math.random() * .7).toFixed(2) + 's';
    if (i % 3 === 0) { c.style.background = 'var(--white)'; c.style.opacity = '.8'; }
    box.appendChild(c);
    setTimeout(() => c.remove(), 7000);
  }
}

/* ── sincronía en vivo con /admin (mismo navegador, sin backend) ── */
const bc = 'BroadcastChannel' in window ? new BroadcastChannel(CHANNEL) : null;
function broadcast() {
  if (suppress) return;
  bc?.postMessage({ type:'nav', from:'deck', slide:cur, step });
}
bc?.addEventListener('message', e => {
  const msg = e.data;
  if (!msg || msg.from === 'deck') return;
  if (msg.type === 'names') { NAMES = msg.names || {}; paint(); }
  if (msg.type === 'nav') { suppress = true; go(msg.slide, msg.step); suppress = false; }
  if (msg.type === 'cmd') {
    if (msg.cmd === 'next') next();
    else if (msg.cmd === 'prev') prev();
    else if (msg.cmd === 'confetti') confetti();
    else if (msg.cmd === 'ping') broadcast();  /* el admin pregunta si hay pantalla viva */
  }
});
/* respaldo si el navegador no trae BroadcastChannel: evento storage entre pestañas */
window.addEventListener('storage', e => { if (e.key === STORE) { loadNames(); paint(); } });

/* ── ticker de patrocinadores, igual que en la pantalla del evento ── */
const one = SPONSORS.map(s => `<img src="${s.src}" alt="${s.name}"><em>■</em>`).join('');
$('track').innerHTML = `<span>${one}</span><span aria-hidden="true">${one}</span>`;

/* ── checker pixelado de la esquina ── */
[[2,0,.19],[4,0,.45],[6,0,.41],[7,0,.39],[8,0,.54],[6,1,.52],[7,1,.16],[8,1,.48],[6,2,.54],[7,2,.34],[8,2,.12],[4,3,.37],[8,3,.48],[5,4,.5],[6,4,.52],[7,4,.29],[8,4,.13],[6,5,.35],[8,5,.28]]
  .forEach(([c, r, o], i) => {
    const el = document.createElement('i');
    el.style.cssText = `left:calc(${c} * 16.6 * var(--k));top:calc(${r} * 16.6 * var(--k));--o:${o};animation-delay:${-i * .7}s`;
    $('checker').appendChild(el);
  });

function clock() {
  const d = new Date();
  $('clock').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
clock(); setInterval(clock, 10000);

/* ── slide inicial: por ruta limpia (/primer) o por hash (#primer) ──
   Al entrar por una ruta directa el slide se muestra completo, para poder
   proyectar un solo premio sin ir paso por paso. */
const key = (location.hash.slice(1) || location.pathname.split('/').pop().replace('.html', '')).toLowerCase();
const found = DECK.findIndex(s => s.id === key || s.route === key);
const start = found < 0 ? 0 : found;
go(start, start === 0 ? 0 : STEPS[start] - 1);

/* ── controles ── */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown' || e.key === 'Enter') { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || e.key === 'Backspace') { e.preventDefault(); prev(); }
  else if (e.key === 'ArrowDown') go(cur + 1, 0);
  else if (e.key === 'ArrowUp') go(cur - 1, 0, true);
  else if (e.key === 'Home') go(0, 0, true);
  else if (e.key === 'End') go(DECK.length - 1, STEPS[DECK.length - 1] - 1);
  else if (e.key === 'c') confetti();
  else if (e.key === 'a') window.open('admin.html', 'innovathon-admin');
  else if (e.key === 'f') document.documentElement.requestFullscreen?.().catch(() => {});
  else if (e.key >= '1' && e.key <= '8') go(+e.key - 1, 0);
});
/* clic para avanzar, clic derecho para volver */
document.addEventListener('click', async e => {
  if (e.target.closest('.pips')) return;
  try { if (!document.fullscreenElement) await document.documentElement.requestFullscreen(); } catch (err) {}
  try { await navigator.wakeLock?.request('screen'); } catch (err) {}
  next();
});
document.addEventListener('contextmenu', e => { e.preventDefault(); prev(); });

let idleT;
document.addEventListener('mousemove', () => {
  document.body.classList.remove('idle'); clearTimeout(idleT);
  idleT = setTimeout(() => document.body.classList.add('idle'), 2500);
});
</script>
